version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: slopeguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slopeguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slopeguard_dev}
      POSTGRES_DB: ${POSTGRES_DB:-slopeguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slopeguard}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: